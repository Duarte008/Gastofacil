<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="description" content="GastoFácil — controlo financeiro pessoal simples e rápido"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>GastoFácil</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--p:#2563eb;--p2:#1d4ed8;--good:#059669;--bad:#dc2626;--warn:#d97706;--shadow:0 8px 28px rgba(15,23,42,.07);--r:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{--bg:#080d18;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--line:#263247;--p:#60a5fa;--p2:#3b82f6}.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:96px}.top{padding:20px 18px 8px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;font-weight:950;letter-spacing:-.7px}.brand span{color:var(--p)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer;color:inherit}.icon{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}.view{padding:8px 16px}.hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:27px;padding:22px;margin:8px 0 15px;box-shadow:var(--shadow)}body.dark .hero{background:linear-gradient(135deg,#020617,#172033)}.hero small{opacity:.72}.balance{font-size:36px;font-weight:950;letter-spacing:-1px;margin:6px 0 16px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#fff1;border-radius:16px;padding:12px}.stat b{display:block;font-size:17px;margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 4px 20px rgba(15,23,42,.035)}.section{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.section h2{font-size:16px;margin:0}.muted{color:var(--muted);font-size:13px}.kpi{font-size:25px;font-weight:950;margin-top:4px}.primary{background:var(--p);color:#fff;border-radius:16px;padding:14px 17px;font-weight:850}.primary:active,.fab:active{transform:scale(.98)}.secondary{background:#eef2ff;color:#1d4ed8;border-radius:14px;padding:11px 14px;font-weight:800}.dark .secondary{background:#172554;color:#bfdbfe}.small{padding:9px 11px;border-radius:12px;background:#f1f5f9;font-weight:750;font-size:12px}.dark .small{background:#1e293b}.fab{position:fixed;z-index:8;bottom:80px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:22px;background:var(--p);color:#fff;font-size:29px;box-shadow:0 14px 35px #2563eb55}.nav{position:fixed;z-index:7;bottom:0;left:0;right:0;height:72px;background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid var(--line)}.dark .nav{background:#111827f2}.navin{max-width:780px;height:100%;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:none;color:var(--muted);font-size:10px;font-weight:800}.nav button.active{color:var(--p)}.nav .plus{font-size:26px;color:var(--p)}.list{display:grid;gap:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.tx{display:flex;align-items:center;gap:11px;min-width:0}.emoji{width:43px;height:43px;flex:0 0 43px;border-radius:14px;background:#f1f5f9;display:grid;place-items:center;font-size:21px}.dark .emoji{background:#1e293b}.txtext{min-width:0}.txtext b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{font-weight:950;white-space:nowrap}.income{color:var(--good)}.expense{color:var(--bad)}.progress{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden;margin-top:8px}.dark .progress{background:#263247}.bar{height:100%;background:var(--p);border-radius:99px}.bar.warn{background:var(--warn)}.bar.bad{background:var(--bad)}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 4px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;font-size:12px;font-weight:750}.search{display:flex;gap:8px}.field{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:12px;outline:0;margin:5px 0 9px}.field:focus{border-color:var(--p)}.quick{display:flex;gap:8px}.quick .field{margin:0}.modal{position:fixed;inset:0;background:#0f172a88;z-index:30;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:780px;margin:auto;background:var(--bg);border-radius:28px 28px 0 0;max-height:94vh;overflow:auto;padding:18px}.handle{width:46px;height:5px;border-radius:99px;background:#cbd5e1;margin:0 auto 14px}.close{float:right;background:none;font-size:24px}.amountInput{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:48px;font-weight:950;padding:8px 0}.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}.cat{border:2px solid transparent;background:var(--card);border-radius:17px;padding:11px 4px;text-align:center}.cat.selected{border-color:var(--p);background:#eff6ff}.dark .cat.selected{background:#172554}.cat div{font-size:23px}.cat small{font-weight:800;font-size:11px}.actions{display:flex;gap:9px;position:sticky;bottom:0;background:var(--bg);padding-top:10px}.actions>*{flex:1}.empty{text-align:center;color:var(--muted);padding:28px}.danger{color:var(--bad)}.dangerbtn{background:#fee2e2;color:#991b1b;border-radius:12px;padding:9px 12px;font-weight:800}.dark .dangerbtn{background:#451a1a;color:#fecaca}.toast{position:fixed;z-index:50;top:18px;left:50%;transform:translateX(-50%) translateY(-90px);background:#0f172a;color:#fff;border-radius:14px;padding:12px 16px;font-weight:800;transition:.25s;box-shadow:var(--shadow)}.toast.show{transform:translateX(-50%) translateY(0)}.switch{appearance:none;width:48px;height:27px;background:#cbd5e1;border-radius:20px;position:relative}.switch:checked{background:var(--p)}.switch:after{content:"";position:absolute;width:21px;height:21px;background:#fff;border-radius:50%;left:3px;top:3px;transition:.2s}.switch:checked:after{left:24px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left}.notice{padding:12px 14px;border-radius:15px;background:#eff6ff;color:#1e40af;font-size:13px}.dark .notice{background:#172554;color:#bfdbfe}.warnbox{background:#fff7ed;color:#9a3412}.dark .warnbox{background:#431407;color:#fed7aa}.dangerbox{background:#fef2f2;color:#991b1b}.dark .dangerbox{background:#450a0a;color:#fecaca}.inline{display:flex;gap:8px;align-items:center}.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.barrow{margin:10px 0}.barlabel{display:flex;justify-content:space-between;gap:8px;font-size:12px}.calendar{font-size:12px}.hidden{display:none!important}@media(min-width:700px){.nav{left:50%;right:auto;transform:translateX(-50%);width:780px}.fab{bottom:86px}.modal{align-items:center}.sheet{border-radius:28px;max-width:660px}}
</style></head><body><div id="toast" class="toast"></div><div class="app"><header class="top"><div class="brand">Gasto<span>Fácil</span></div><button class="icon" onclick="go('settings')">⚙️</button></header><main id="main" class="view"></main></div><button class="fab" onclick="openAdd('expense')">+</button><nav class="nav"><div class="navin"><button data-tab="home" onclick="go('home')">🏠<br>Início</button><button data-tab="analytics" onclick="go('analytics')">📊<br>Análises</button><button class="plus" onclick="openAdd('expense')">＋</button><button data-tab="accounts" onclick="go('accounts')">💳<br>Contas</button><button data-tab="settings" onclick="go('settings')">⚙️<br>Definições</button></div></nav><div id="modal" class="modal"><div class="sheet"><div class="handle"></div><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>
const KEY='gastofacil_v3';
const CAT=[['food','🍔','Alimentação'],['market','🛒','Supermercado'],['fuel','⛽','Combustível'],['home','🏠','Casa'],['bills','💡','Contas'],['tel','📱','Telecomunicações'],['shopping','🛍️','Compras'],['fun','🎮','Lazer'],['health','🏋️','Saúde/Desporto'],['transport','🚕','Transportes'],['debt','💳','Dívidas/Crédito'],['other','📦','Outros']];
const INC=[['salary','💰','Salário'],['work','💼','Trabalho extra'],['business','🏪','Negócio'],['transfer','💸','Transferência'],['otheri','📦','Outros']];
let db=load(), page='home', editId=null;
function fresh(demo=false){let x={version:3,profile:{name:'Utilizador'},accounts:[{id:uid(),name:'Banco',type:'bank',opening:demo?2100:0},{id:uid(),name:'Dinheiro',type:'cash',opening:demo?100:0}],cards:[],tx:[],categories:CAT.map(c=>({id:c[0],name:c[2],icon:c[1],color:'#2563eb',limit:null})),budgets:{monthly:demo?2000:0,categories:{}},recurring:[],settings:{dark:false,alerts:true,firstRun:false},demo};if(demo){let d=today();x.tx=[{id:uid(),type:'income',amount:2100,category:'salary',desc:'Salário',date:d,accountId:x.accounts[0].id},{id:uid(),type:'expense',amount:12.5,category:'food',desc:'Almoço',date:d,accountId:x.accounts[0].id},{id:uid(),type:'expense',amount:30,category:'fuel',desc:'Gasolina',date:d,accountId:x.accounts[0].id}]}return x}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x||fresh(false)}catch(e){return fresh(false)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function today(){return new Date().toISOString().slice(0,10)}function eur(n){return Number(n||0).toLocaleString('pt-PT',{style:'currency',currency:'EUR'})}function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}function cat(k){return db.categories.find(c=>c.id===k)||{id:'other',name:'Outros',icon:'📦',limit:null}}function account(id){return db.accounts.find(a=>a.id===id)}function sum(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}function month(){return today().slice(0,7)}function monthTx(){return db.tx.filter(t=>t.date.slice(0,7)===month())}function expenses(arr=db.tx){return arr.filter(t=>t.type==='expense')}function incomes(arr=db.tx){return arr.filter(t=>t.type==='income')}
function accountBalance(a){let v=Number(a.opening||0);db.tx.filter(t=>t.accountId===a.id).forEach(t=>{if(t.type==='income')v+=t.amount;else if(t.type==='expense'&&!t.credit)v-=t.amount});return v}function cardBill(card){return sum(db.tx.filter(t=>t.cardId===card.id&&t.type==='expense'&&t.credit&&t.date.slice(0,7)===month()))}
function go(p){page=p;render()}function render(){applyTheme();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));document.getElementById('main').innerHTML={home,analytics,accounts,settings}[page]();maybeRecurring()}
function applyTheme(){document.body.classList.toggle('dark',db.settings.dark)}
function home(){let mt=monthTx(),e=sum(expenses(mt)),i=sum(incomes(mt)),bal=sum(db.accounts.map(accountBalance)),day=sum(expenses(db.tx.filter(t=>t.date===today()))),week=sum(expenses(db.tx.filter(t=>daysAgo(t.date)<7)));let budget=Number(db.budgets.monthly||0),remaining=budget?budget-e:0;return `<div class="hero"><small>Saldo disponível</small><div class="balance">${eur(bal)}</div><div class="stats"><div class="stat"><small>Gastos este mês</small><b>${eur(e)}</b></div><div class="stat"><small>Receitas</small><b>${eur(i)}</b></div></div></div><div class="grid2"><div class="card"><div class="muted">Hoje</div><div class="kpi">${eur(day)}</div></div><div class="card"><div class="muted">Esta semana</div><div class="kpi">${eur(week)}</div></div></div>${budget?`<div class="section"><h2>Orçamento mensal</h2><span class="muted">${eur(Math.max(remaining,0))} disponível</span></div><div class="card"><div class="barlabel"><b>${eur(e)} / ${eur(budget)}</b><span>${Math.round(e/budget*100)}%</span></div><div class="progress"><div class="bar ${e>budget?'bad':e/budget>=.85?'warn':''}" style="width:${Math.min(100,e/budget*100)}%"></div></div>${e>budget?`<p class="muted danger">🔴 Ultrapassou o orçamento em ${eur(e-budget)}.</p>`:e/budget>=.85?`<p class="muted">⚠️ Já utilizou ${Math.round(e/budget*100)}% do orçamento.</p>`:''}</div>`:''}<div class="section"><h2>⚡ Gasto rápido</h2><button class="small" onclick="openQuick()">Abrir</button></div><div class="card quick"><input id="quickHome" class="field" placeholder="12,50 almoço" onkeydown="if(event.key==='Enter')quickFromHome()"><button class="primary" onclick="quickFromHome()">→</button></div><div class="section"><h2>Últimos lançamentos</h2><button class="small" onclick="go('analytics')">Ver tudo</button></div><div class="list">${txList(db.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7))}</div>`}
function txList(list){if(!list.length)return `<div class="card empty">Ainda não há lançamentos.</div>`;return list.map(t=>{let c=t.type==='income'?INC.find(x=>x[0]===t.category)||INC[4]:cat(t.category);return `<div class="card row" onclick="editTx('${t.id}')"><div class="tx"><div class="emoji">${c.icon||c[1]}</div><div class="txtext"><b>${esc(t.desc||c.name||c[2])}</b><div class="muted">${esc(c.name||c[2])} · ${fmtDate(t.date)}${t.credit?' · 💳 crédito':''}</div></div></div><div class="amount ${t.type==='income'?'income':'expense'}">${t.type==='income'?'+':'−'}${eur(t.amount)}</div></div>`}).join('')}
function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'})}function daysAgo(d){return (Date.now()-new Date(d+'T00:00:00').getTime())/864e5}
function openAdd(type='expense',pref={}){editId=null;let cats=type==='expense'?db.categories:INC.map(x=>({id:x[0],name:x[2],icon:x[1]}));openModal(`<h2>${type==='expense'?'➕ Registar gasto':'💰 Registar receita'}</h2><div class="muted">Meta: menos de 5 segundos.</div><input id="amt" class="amountInput" inputmode="decimal" autofocus placeholder="€ 0,00" value="${pref.amount||''}"><div class="catgrid">${cats.map(c=>`<button class="cat ${pref.category===c.id||(type==='expense'&&!pref.category&&c.id==='food')?'selected':''}" data-cat="${c.id}" onclick="pickCat(this)"><div>${c.icon}</div><small>${esc(c.name)}</small></button>`).join('')}</div><input id="desc" class="field" placeholder="Descrição (opcional)" value="${esc(pref.desc||'')}"><select id="account" class="field">${db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} · ${eur(accountBalance(a))}</option>`).join('')}</select>${type==='expense'?`<label class="inline muted"><input id="credit" type="checkbox" ${pref.credit?'checked':''}> Compra no cartão de crédito</label><select id="card" class="field ${pref.credit?'':'hidden'}">${db.cards.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`:''}<input id="date" class="field" type="date" value="${pref.date||today()}"><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveTx('${type}')">${type==='expense'?'GUARDAR GASTO':'GUARDAR RECEITA'}</button></div>`);if(document.getElementById('credit'))document.getElementById('credit').onchange=e=>document.getElementById('card').classList.toggle('hidden',!e.target.checked)}
function pickCat(el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function parseMoney(v){v=String(v||'').trim().replace(/€/g,'').replace(/\./g,'').replace(',','.');return Number(v.replace(/[^0-9.]/g,''))||0}
function saveTx(type){let amount=parseMoney(document.getElementById('amt').value);if(!amount)return toast('Digite o valor.');let selected=document.querySelector('.cat.selected')?.dataset.cat||(type==='expense'?'food':'salary');let t={id:editId||uid(),type,amount,category:selected,desc:document.getElementById('desc').value.trim(),date:document.getElementById('date').value||today(),accountId:document.getElementById('account').value};if(type==='expense'&&document.getElementById('credit')?.checked){t.credit=true;t.cardId=document.getElementById('card').value||db.cards[0]?.id;if(!t.cardId)return toast('Crie um cartão primeiro.')}if(editId){let i=db.tx.findIndex(x=>x.id===editId);db.tx[i]=t}else db.tx.push(t);save();closeModal();toast(editId?'Lançamento atualizado':'Guardado ✓');render()}
function editTx(id){let t=db.tx.find(x=>x.id===id);if(!t)return;editId=id;openModal(`<h2>✏️ Editar lançamento</h2><input id="amt" class="amountInput" inputmode="decimal" value="${String(t.amount).replace('.',',')}"><div class="catgrid">${(t.type==='expense'?db.categories:INC.map(x=>({id:x[0],name:x[2],icon:x[1]}))).map(c=>`<button class="cat ${t.category===c.id?'selected':''}" data-cat="${c.id}" onclick="pickCat(this)"><div>${c.icon}</div><small>${esc(c.name)}</small></button>`).join('')}</div><input id="desc" class="field" value="${esc(t.desc||'')}" placeholder="Descrição"><select id="account" class="field">${db.accounts.map(a=>`<option value="${a.id}" ${a.id===t.accountId?'selected':''}>${esc(a.name)}</option>`).join('')}</select><input id="date" class="field" type="date" value="${t.date}"><div class="actions"><button class="dangerbtn" onclick="deleteTx('${id}')">Excluir</button><button class="primary" onclick="saveTx('${t.type}')">Guardar</button></div>`)}
function deleteTx(id){if(confirm('Excluir este lançamento?')){db.tx=db.tx.filter(t=>t.id!==id);save();closeModal();toast('Excluído');render()}}
function quickFromHome(){let v=document.getElementById('quickHome').value;if(v.trim())openQuick(v)}function openQuick(v=''){openModal(`<h2>⚡ Gasto rápido</h2><div class="muted">Escreva como falaria normalmente.</div><input id="quick" class="field" autofocus placeholder="12,50 almoço" value="${esc(v)}"><div id="qprev" class="card">Digite algo para interpretar.</div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="previewQuick(true)">Confirmar</button></div>`);document.getElementById('quick').oninput=()=>previewQuick(false);previewQuick(false)}
function parseQuick(s){let low=s.toLowerCase();let m=s.replace(/\./g,'').match(/(?:€\s*)?(\d+(?:[,.]\d{1,2})?)/);let amount=m?parseMoney(m[1]):0;let category='other';if(/gasolina|combustível|combustivel|diesel|gas\b/.test(low))category='fuel';else if(/supermercado|continente|pingo|lidl|mercado|mercearia/.test(low))category='market';else if(/almoço|almoco|jantar|café|cafe|comida|lanche|restaurante|mcdonald|pizza/.test(low))category='food';else if(/renda|luz|água|agua|internet|netflix|spotify|seguro|prestação|prestacao/.test(low))category='bills';else if(/uber|autocarro|metro|combust/.test(low))category='transport';let desc=s.replace(/€?\s*\d+(?:[,.]\d{1,2})?/,'').trim();desc=desc||cat(category).name;return{amount,category,desc}}
function previewQuick(confirmSave){let p=parseQuick(document.getElementById('quick').value);document.getElementById('qprev').innerHTML=p.amount?`<b>${eur(p.amount)}</b><br>${cat(p.category).icon} ${cat(p.category).name}<br>${esc(p.desc)}`:'Ainda não encontrei um valor.';if(confirmSave&&p.amount){closeModal();openAdd('expense',p)}}
function analytics(){let mt=monthTx(),e=sum(expenses(mt)),i=sum(incomes(mt)),by={};expenses(mt).forEach(t=>by[t.category]=(by[t.category]||0)+t.amount);let rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);let forecast=e/Math.max(1,new Date().getDate())*new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();return `<div class="section"><h2>📊 Análises</h2><span class="muted">${new Date().toLocaleDateString('pt-PT',{month:'long',year:'numeric'})}</span></div><div class="grid2"><div class="card"><div class="muted">Despesas</div><div class="kpi">${eur(e)}</div></div><div class="card"><div class="muted">Receitas</div><div class="kpi">${eur(i)}</div></div></div><div class="section"><h2>Para onde vai o dinheiro?</h2></div><div class="card">${rows.length?rows.map(([k,v])=>{let p=e?v/e*100:0,c=cat(k);return `<div class="barrow"><div class="barlabel"><span>${c.icon} ${c.name}</span><b>${p.toFixed(0)}% · ${eur(v)}</b></div><div class="progress"><div class="bar" style="width:${p}%"></div></div></div>`}).join(''):'Sem dados ainda.'}</div><div class="section"><h2>🔮 Previsão do mês</h2></div><div class="card"><b>${eur(forecast)}</b><div class="muted">estimativa se mantiver o ritmo atual</div>${db.budgets.monthly?`<p class="muted">${forecast<=db.budgets.monthly?'🟢 Dentro do orçamento.':'🟠 Poderá ultrapassar o orçamento em '+eur(forecast-db.budgets.monthly)+'.'}</p>`:''}</div><div class="section"><h2>Histórico</h2><button class="small" onclick="openSearch()">🔎 Pesquisar</button></div><div class="list">${txList(db.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</div>`}
function openSearch(){openModal(`<h2>🔎 Pesquisar</h2><div class="search"><input id="search" class="field" placeholder="McDonald's, gasolina, 30…"><button class="primary" onclick="doSearch()">Buscar</button></div><div class="chips"><button class="chip" onclick="setSearch('')">Tudo</button><button class="chip" onclick="setSearch('food')">🍔 Alimentação</button><button class="chip" onclick="setSearch('fuel')">⛽ Combustível</button></div><div id="results" class="list"></div>`);document.getElementById('search').oninput=doSearch;doSearch()}function setSearch(q){document.getElementById('search').value=q;doSearch()}function doSearch(){let q=document.getElementById('search').value.toLowerCase();let r=db.tx.filter(t=>{let c=cat(t.category);return (t.desc+' '+c.name+' '+t.amount+' '+t.date+' '+(account(t.accountId)?.name||'')).toLowerCase().includes(q)||t.category===q});document.getElementById('results').innerHTML=txList(r)}
function accounts(){return `<div class="section"><h2>💳 Contas e carteiras</h2><button class="primary" onclick="newAccount()">+ Conta</button></div><div class="list">${db.accounts.map(a=>`<div class="card row"><div><b>${a.type==='cash'?'💵':a.type==='bank'?'🏦':a.type==='mbway'?'📱':'💳'} ${esc(a.name)}</b><div class="muted">Saldo atual</div></div><b>${eur(accountBalance(a))}</b></div>`).join('')}</div><div class="section"><h2>Cartões de crédito</h2><button class="secondary" onclick="newCard()">+ Cartão</button></div><div class="list">${db.cards.length?db.cards.map(c=>`<div class="card"><div class="row"><b>💳 ${esc(c.name)}</b><b>${eur(cardBill(c))}</b></div><div class="muted">Limite ${eur(c.limit)} · Fecho dia ${c.close} · Pagamento dia ${c.pay}</div></div>`).join(''):'<div class="card empty">Nenhum cartão.</div>'}</div>`}
function newAccount(){openModal(`<h2>🏦 Nova conta</h2><input id="n" class="field" placeholder="Nome (Banco, MB WAY…)"/><select id="t" class="field"><option value="bank">Banco</option><option value="cash">Dinheiro</option><option value="mbway">MB WAY</option><option value="savings">Poupança</option></select><input id="o" class="field" type="number" step="0.01" placeholder="Saldo inicial"><button class="primary" style="width:100%" onclick="saveAccount()">Guardar</button>`)}function saveAccount(){db.accounts.push({id:uid(),name:document.getElementById('n').value||'Conta',type:document.getElementById('t').value,opening:Number(document.getElementById('o').value)||0});save();closeModal();toast('Conta criada');render()}
function newCard(){openModal(`<h2>💳 Novo cartão</h2><input id="cn" class="field" placeholder="Nome do cartão"><input id="cl" class="field" type="number" placeholder="Limite"><input id="cc" class="field" type="number" min="1" max="31" placeholder="Dia de fecho"><input id="cp" class="field" type="number" min="1" max="31" placeholder="Dia de pagamento"><button class="primary" style="width:100%" onclick="saveCard()">Guardar</button>`)}function saveCard(){db.cards.push({id:uid(),name:document.getElementById('cn').value||'Cartão',limit:Number(document.getElementById('cl').value)||0,close:Number(document.getElementById('cc').value)||1,pay:Number(document.getElementById('cp').value)||1});save();closeModal();toast('Cartão criado');render()}
function settings(){let total=sum(expenses()),bud=Number(db.budgets.monthly||0);return `<div class="section"><h2>⚙️ Definições</h2></div><div class="list"><div class="card row"><div><b>🌙 Modo escuro</b><div class="muted">Seguir o tema do dispositivo ou escolher manualmente</div></div><input class="switch" type="checkbox" ${db.settings.dark?'checked':''} onchange="db.settings.dark=this.checked;save();render()"></div><div class="card"><b>👤 Perfil</b><input id="name" class="field" value="${esc(db.profile.name)}" placeholder="Seu nome"><button class="secondary" onclick="db.profile.name=document.getElementById('name').value||'Utilizador';save();toast('Perfil atualizado')">Guardar</button></div><div class="card"><b>💰 Orçamento mensal</b><input id="budget" class="field" type="number" step="0.01" value="${bud||''}" placeholder="2000"><button class="secondary" onclick="db.budgets.monthly=parseMoney(document.getElementById('budget').value);save();toast('Orçamento atualizado');render()">Guardar orçamento</button></div><div class="card"><b>📂 Categorias</b><div class="muted">Crie categorias com limite próprio.</div><button class="secondary" onclick="newCategory()">+ Nova categoria</button><div style="margin-top:10px">${db.categories.map(c=>`<div class="row" style="padding:7px 0"><span>${c.icon} ${esc(c.name)}</span><span>${c.limit?eur(c.limit):'Sem limite'}</span></div>`).join('')}</div></div><div class="card"><b>🔄 Despesas fixas</b><div class="muted">Renda, luz, internet, assinaturas e prestações.</div><button class="secondary" onclick="newRecurring()">+ Despesa fixa</button><div style="margin-top:10px">${db.recurring.length?db.recurring.map(r=>`<div class="row" style="padding:6px 0"><span>${r.icon||'🔄'} ${esc(r.name)}</span><b>${eur(r.amount)}</b></div>`).join(''):'<span class="muted">Nenhuma cadastrada.</span>'}</div></div><div class="card"><b>🎙️ Entrada por voz</b><div class="muted">“Gastei 18 euros no jantar.”</div><button class="secondary" onclick="voiceAdd()">🎙️ Falar gasto</button></div><div class="card"><b>📷 Escanear recibo</b><div class="muted">Selecione uma foto do talão. Nesta versão o OCR é preparado para integração futura; os dados continuam privados no dispositivo.</div><input class="field" type="file" accept="image/*" capture="environment" onchange="receipt(this)"></div><div class="card"><b>📤 Exportar</b><div class="muted">CSV ou backup completo JSON. PDF pode ser gerado pelo menu Imprimir do dispositivo.</div><div class="inline"><button class="secondary" onclick="exportCSV()">CSV</button><button class="secondary" onclick="exportJSON()">Backup JSON</button><button class="secondary" onclick="printReport()">PDF / Imprimir</button></div></div><div class="card"><b>🔔 Alertas</b><div class="muted">Avisos locais de orçamento.</div><input class="switch" type="checkbox" ${db.settings.alerts?'checked':''} onchange="db.settings.alerts=this.checked;save()"></div><div class="card"><b>🧹 Dados</b><p class="muted">Apagar tudo e começar do zero ou carregar demonstração.</p><div class="inline"><button class="dangerbtn" onclick="resetAll()">Começar do zero</button><button class="secondary" onclick="loadDemo()">Dados demo</button></div></div></div>`}
function newCategory(){openModal(`<h2>🏷️ Nova categoria</h2><input id="catname" class="field" placeholder="Nome"><input id="caticon" class="field" placeholder="Emoji" value="✨"><input id="catlim" class="field" type="number" placeholder="Limite mensal opcional"><button class="primary" style="width:100%" onclick="saveCategory()">Criar categoria</button>`)}function saveCategory(){db.categories.push({id:uid(),name:document.getElementById('catname').value||'Nova categoria',icon:document.getElementById('caticon').value||'✨',color:'#2563eb',limit:Number(document.getElementById('catlim').value)||null});save();closeModal();toast('Categoria criada');render()}
function newRecurring(){openModal(`<h2>🔄 Despesa fixa</h2><input id="rn" class="field" placeholder="Ex.: Internet"><input id="ra" class="field" type="number" step="0.01" placeholder="Valor"><input id="rd" class="field" type="number" min="1" max="31" placeholder="Dia de pagamento"><select id="rc" class="field">${db.categories.map(c=>`<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('')}</select><select id="rp" class="field"><option>Mensal</option><option>Semanal</option></select><button class="primary" style="width:100%" onclick="saveRecurring()">Guardar</button>`)}function saveRecurring(){db.recurring.push({id:uid(),name:document.getElementById('rn').value||'Despesa fixa',amount:Number(document.getElementById('ra').value)||0,day:Number(document.getElementById('rd').value)||1,category:document.getElementById('rc').value,period:document.getElementById('rp').value,lastGenerated:null});save();closeModal();toast('Despesa fixa criada');render()}
function maybeRecurring(){let d=new Date(),ym=d.toISOString().slice(0,7);let changed=false;db.recurring.forEach(r=>{if(r.period==='Mensal'&&r.lastGenerated!==ym&&d.getDate()>=r.day){db.tx.push({id:uid(),type:'expense',amount:r.amount,category:r.category,desc:r.name,date:today(),accountId:db.accounts[0]?.id||'',recurringId:r.id});r.lastGenerated=ym;changed=true}});if(changed)save()}
function voiceAdd(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voz não suportada neste navegador.');let r=new R();r.lang='pt-PT';r.onresult=e=>{let p=parseQuick(e.results[0][0].transcript);openAdd('expense',p)};r.start();toast('A ouvir…')}
function receipt(input){if(input.files?.[0])toast('Foto recebida. OCR necessita de um serviço de reconhecimento para extrair os campos automaticamente.')}
function exportCSV(){let rows=[['Data','Tipo','Valor','Categoria','Descrição','Conta','Crédito'],...db.tx.map(t=>[t.date,t.type,t.amount,cat(t.category).name,t.desc||'',account(t.accountId)?.name||'',t.credit?'Sim':'Não'])];download('gastofacil.csv','text/csv;charset=utf-8','\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n'))}
function exportJSON(){download('gastofacil-backup.json','application/json',JSON.stringify(db,null,2))}function download(name,type,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function printReport(){let w=window.open('','_blank');if(!w)return;w.document.write(`<html><head><title>GastoFácil</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>GastoFácil — Relatório</h1><p>Gerado em ${new Date().toLocaleString('pt-PT')}</p><table><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th></tr>${db.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${fmtDate(t.date)}</td><td>${t.type}</td><td>${esc(cat(t.category).name)}</td><td>${esc(t.desc||'')}</td><td>${eur(t.amount)}</td></tr>`).join('')}</table></body></html>`);w.document.close();w.print()}
function resetAll(){if(confirm('Apagar todos os dados?')){db=fresh(false);db.settings.firstRun=true;save();render();toast('Começou do zero')}}function loadDemo(){db=fresh(true);save();render();toast('Dados de demonstração carregados')}
function openAI(){openModal(`<h2>🤖 Assistente financeiro</h2><div class="muted">Pergunte sobre os dados guardados neste dispositivo.</div><input id="aiq" class="field" placeholder="Quanto gastei com comida este mês?" onkeydown="if(event.key==='Enter')answerAI()"><div id="aians" class="card">Pronto.</div>`)}function answerAI(){let q=document.getElementById('aiq').value.toLowerCase(),mt=monthTx(),ans='Posso analisar os lançamentos locais.';if(/comida|alimentação|alimentacao/.test(q))ans=`Este mês gastou ${eur(sum(expenses(mt).filter(t=>t.category==='food')))} em alimentação.`;else if(/maior gasto/.test(q)){let m=expenses(mt).sort((a,b)=>b.amount-a.amount)[0];ans=m?`O maior gasto deste mês foi ${eur(m.amount)} — ${esc(m.desc||cat(m.category).name)}.`:'Não há gastos este mês.'}else if(/última semana|ultima semana/.test(q)){ans=`Na última semana gastou ${eur(sum(expenses(db.tx.filter(t=>daysAgo(t.date)<7))))}.`}else if(/por dia|posso gastar/.test(q)){let b=Number(db.budgets.monthly||0),spent=sum(expenses(mt)),last=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate(),days=Math.max(1,last-new Date().getDate()+1);ans=b?`Pode gastar cerca de ${eur(Math.max(0,b-spent)/days)} por dia até ao fim do mês.`:'Defina um orçamento mensal primeiro.'}document.getElementById('aians').innerHTML=ans}
function closeModal(){document.getElementById('modal').classList.remove('open')}function openModal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(window.toastT);window.toastT=setTimeout(()=>e.classList.remove('show'),2200)}
if(!db.categories?.length){db=fresh(false);save()}render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
